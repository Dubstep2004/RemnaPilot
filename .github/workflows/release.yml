name: release

# Новый релиз создаётся сам, когда в remnapilot.sh меняется RP_VERSION.
# К релизу прикрепляются remnapilot.sh и remnapilot.sh.sha256 — скрипт обновляется оттуда
# и не ставит файл, если контрольная сумма не совпала.

on:
  push:
    branches: [main]
    paths: ['remnapilot.sh', 'src/**', 'CHANGELOG.md', 'tests/**', 'tools/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия из скрипта
        id: v
        run: |
          v=$(grep -m1 '^RP_VERSION=' remnapilot.sh | cut -d'"' -f2)
          [ -n "$v" ] || { echo "RP_VERSION не найден"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Релиз уже есть?
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Релиз v${{ steps.v.outputs.version }} уже есть — пропускаю"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Тесты — релиз не выйдет, если хоть один упал
        if: steps.t.outputs.exists == '0'
        run: sudo bash tests/run.sh

      - name: Описание релиза
        if: steps.t.outputs.exists == '0'
        run: python3 tools/changelog.py --release "${{ steps.v.outputs.version }}" > notes.md

      - name: Создать релиз
        if: steps.t.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          sha256sum remnapilot.sh > remnapilot.sh.sha256
          cat remnapilot.sh.sha256
          gh release create "v$v" remnapilot.sh remnapilot.sh.sha256 \
            --title "🛰️ RemnaPilot v$v" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Обновить описания всех релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            v="${t#v}"
            grep -qx "## v$v" CHANGELOG.md || continue
            if gh release view "$t" --json assets --jq '.assets[].name' | grep -qx remnapilot.sh; then
              python3 tools/changelog.py --release "$v" > notes.md
            else
              python3 tools/changelog.py --release "$v" --archived > notes.md
            fi
            gh release edit "$t" --title "🛰️ RemnaPilot $t" --notes-file notes.md >/dev/null && echo "✔ $t"
          done
