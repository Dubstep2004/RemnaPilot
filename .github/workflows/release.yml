name: release

# Новый релиз создаётся сам, когда в remnapilot.sh меняется RP_VERSION.
# К релизу прикрепляются remnapilot.sh и remnapilot.sh.sha256 — скрипт обновляется оттуда
# и не ставит файл, если контрольная сумма не совпала.

on:
  push:
    branches: [main]
    paths: ['remnapilot.sh', 'CHANGELOG.md', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия из скрипта
        id: v
        run: |
          v=$(grep -m1 '^RP_VERSION=' remnapilot.sh | cut -d'"' -f2)
          [ -n "$v" ] || { echo "RP_VERSION не найден"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Релиз уже есть?
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Релиз v${{ steps.v.outputs.version }} уже есть — пропускаю"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Тесты — релиз не выйдет, если хоть один упал
        if: steps.t.outputs.exists == '0'
        run: sudo bash tests/run.sh

      - name: Описание релиза из CHANGELOG.md
        if: steps.t.outputs.exists == '0'
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v h="## v$v" '$0==h{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "- RemnaPilot v$v" > notes.md
          cat >> notes.md <<'EOF'

          **Установка**
          ```bash
          bash <(curl -sSL https://raw.githubusercontent.com/Dubstep2004/RemnaPilot/main/remnapilot.sh)
          ```
          **Уже установлен** — `rw` → Панель → Обновления → RemnaPilot → 1, или `rw --self-update`
          EOF
          sed -i 's/^          //' notes.md

      - name: Создать релиз
        if: steps.t.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          sha256sum remnapilot.sh > remnapilot.sh.sha256
          cat remnapilot.sh.sha256
          gh release create "v$v" remnapilot.sh remnapilot.sh.sha256 \
            --title "RemnaPilot v$v" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
